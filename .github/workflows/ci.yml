
name: CI
# запускаем при отправке изменений
on:
# отправляет собранный образ
  push:
    branches: [main]
    tags: ['v*']
# утсановка, заупск тестов
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry and dependencies
        run: |
          pip install poetry
          poetry install

      - name: Run tests
      # сохраняем результаты
        run: poetry run pytest --junitxml=report.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml

  build:
  # только после успешных тестов
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # yfpdfybt gj ntue bkb rjvvbne
      - name: Set image tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main_${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build and publish image
        run: |
          docker build -t ghcr.io/zenvectors/audit-svc:$IMAGE_TAG .
          docker push ghcr.io/zenvectors/audit-svc:$IMAGE_TAG


  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, deploy]
    environment: deploy

    permissions:
      contents: read
      packages: read

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          IMAGE: ghcr.io/zenvectors/audit-svc:${{ github.ref_name }}
        run: |
          set -e
          umask 077
          VAULT_FILE=$(mktemp)
          trap 'rm -f "$VAULT_FILE"' EXIT
          printf '%s' "$VAULT_PASSWORD" > "$VAULT_FILE"

          ansible-playbook -i localhost, deploy/site.yml \
            --vault-password-file "$VAULT_FILE" \
            -e "{\"audit_image\":\"$IMAGE\"}"
