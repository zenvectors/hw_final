server {
    listen 8080;

    # Запрещаем внешний доступ к обновлению конфига
    location ^~ /reload {
        return 404;
    }

    # Остальные запросы передаём приложению
    location / {
        proxy_pass http://audit-svc:8080;
    }
}

server {
    listen 8081;

    # Статистика для nginx-exporter
    location = /stub_status {
        stub_status;
        allow 172.19.0.0/16;
        deny all;
    }
}